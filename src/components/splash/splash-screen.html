<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash screen</title>
<style>
  :root { --bg:#ffffff; --track:#e6edff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0e1a; --track:#1b2440; } }
  html, body { margin:0; height:100%; font-family: system-ui, sans-serif; }

  /* ===== SPLASH ===== */
  #splash {
    position:fixed; inset:0; z-index:9999; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    transition: opacity .6s ease, transform .6s ease;
  }
  #splash.leave { opacity:0; transform:scale(1.04); pointer-events:none; }
  #splash svg { width:clamp(130px, 30vmin, 210px); height:auto; overflow:visible; transition:transform .6s ease; }
  #splash.leave svg { transform:scale(1.15); }

  #logo { transform-origin:512px 512px; animation: breathe 2.6s ease-in-out 2.2s infinite; }

  /* corner brackets slide in */
  .br { opacity:0; animation: brIn .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .br.tl { --dx:-26px; --dy:-26px; animation-delay:.10s; }
  .br.tr { --dx: 26px; --dy:-26px; animation-delay:.18s; }
  .br.bl { --dx:-26px; --dy: 26px; animation-delay:.26s; }
  .br.br { --dx: 26px; --dy: 26px; animation-delay:.34s; }
  @keyframes brIn { from { opacity:0; transform:translate(var(--dx),var(--dy)); } to { opacity:1; transform:none; } }

  /* main frame draws itself */
  .frame { fill:none; stroke-width:40; stroke-linejoin:round; stroke-dasharray:1 1; stroke-dashoffset:1;
           animation: draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  /* inner corner squares pop */
  .sq { opacity:0; transform-box:fill-box; transform-origin:center; animation: pop .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  .sq:nth-of-type(6){animation-delay:1.25s} .sq:nth-of-type(7){animation-delay:1.31s}
  .sq:nth-of-type(8){animation-delay:1.37s} .sq:nth-of-type(9){animation-delay:1.43s}
  @keyframes pop { from { opacity:0; transform:scale(.3); } to { opacity:.28; transform:scale(1); } }

  /* center glyph: outline draws, then fills */
  .g-line { fill:none; stroke-width:3; stroke-dasharray:1 1; stroke-dashoffset:1;
            animation: draw .7s ease-in-out .9s forwards, fade .3s ease 1.6s forwards; }
  .g-fill { opacity:0; transform-box:fill-box; transform-origin:center;
            animation: fillIn .5s cubic-bezier(.2,1.3,.4,1) 1.45s forwards; }
  @keyframes fade { to { opacity:0; } }
  @keyframes fillIn { from { opacity:0; transform:scale(.88); } to { opacity:1; transform:scale(1); } }

  /* scanner sweep */
  .scan { opacity:0; animation: scan 3s ease-in-out 2s infinite; }
  @keyframes scan {
    0%  { transform:translateY(389px); opacity:0; }
    8%  { opacity:1; }
    52% { transform:translateY(635px); opacity:1; }
    60%,100% { transform:translateY(635px); opacity:0; }
  }

  @keyframes breathe { 50% { transform:scale(1.035); } }

  /* loading bar */
  .bar { width:96px; height:3px; border-radius:3px; background:var(--track); overflow:hidden; opacity:0; animation: fadeIn .4s ease 1.7s forwards; }
  .bar span { display:block; width:40%; height:100%; border-radius:3px; background:linear-gradient(90deg,#00c8ff,#4a3dff); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
  @keyframes fadeIn { to { opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    #splash * { animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
    .scan, .bar { display:none; }
  }

</style>
</head>
<body>

<!-- ===== SPLASH MARKUP: copy this block into your app ===== -->
<div id="splash" role="status" aria-label="Loading">
  <svg viewBox="297 297 430 430" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="330" y1="320" x2="700" y2="700">
        <stop offset="0" stop-color="#00c8ff"/><stop offset=".5" stop-color="#1e8fff"/><stop offset="1" stop-color="#4a3dff"/>
      </linearGradient>
      <linearGradient id="sg" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#00c8ff" stop-opacity="0"/><stop offset=".5" stop-color="#00c8ff"/><stop offset="1" stop-color="#4a3dff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="tg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#1e8fff" stop-opacity="0"/><stop offset="1" stop-color="#1e8fff" stop-opacity=".28"/>
      </linearGradient>
      <clipPath id="inner"><rect x="389" y="389" width="246" height="246"/></clipPath>
    </defs>
    <g id="logo" fill="url(#g)">
      <!-- corner brackets -->
      <path class="br tl" d="M317 398V332a14 14 0 0 1 14-14H397V331H333a2 2 0 0 0-2 2V398Z"/>
      <path class="br tr" d="M707 398V332a14 14 0 0 0-14-14H627V331H691a2 2 0 0 1 2 2V398Z"/>
      <path class="br bl" d="M317 626V692a14 14 0 0 0 14 14H397V693H333a2 2 0 0 1-2-2V626Z"/>
      <path class="br br" d="M707 626V692a14 14 0 0 1-14 14H627V693H691a2 2 0 0 0 2-2V626Z"/>

      <!-- main frame (with the gap at the top) -->
      <path class="frame" pathLength="1" stroke="url(#g)"
            d="M498 369H369V655H655V369H526"/>

      <!-- inner corner squares -->
      <path class="sq" d="M389 389H413V403a10 10 0 0 1-10 10H389Z"/>
      <path class="sq" d="M634 389H610V403a10 10 0 0 0 10 10H634Z"/>
      <path class="sq" d="M389 634H413V620a10 10 0 0 0-10-10H389Z"/>
      <path class="sq" d="M634 634H610V620a10 10 0 0 1 10-10H634Z"/>

      <!-- center glyph -->
      <path class="g-line" pathLength="1" stroke="url(#g)"
            d="M460 441H564A18 18 0 0 1 582 459V522H542V481H481V542H530L568 582H460A18 18 0 0 1 442 564V459A18 18 0 0 1 460 441Z"/>
      <path class="g-fill"
            d="M460 441H564A18 18 0 0 1 582 459V522H542V481H481V542H530L568 582H460A18 18 0 0 1 442 564V459A18 18 0 0 1 460 441Z"/>

      <!-- scanner sweep -->
      <g clip-path="url(#inner)">
        <g class="scan">
          <rect x="389" y="-30" width="246" height="30" fill="url(#tg)"/>
          <rect x="389" y="-1.5" width="246" height="3" fill="url(#sg)"/>
        </g>
      </g>
    </g>
  </svg>
  <div class="bar"><span></span></div>
</div>

<script>
  /* ===== SPLASH LOGIC: copy this into your app ===== */
  const Splash = (() => {
    const MIN_MS = 3000;            // minimum time the splash stays visible
    let start = performance.now();

    function hide() {
      const wait = Math.max(0, MIN_MS - (performance.now() - start));
      setTimeout(() => {
        const el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('leave');
        setTimeout(() => el.remove(), 700);
      }, wait);
    }
    return { hide };
  })();

  // Auto-hide once the page has loaded.
  // In a SPA, remove this line and call Splash.hide() after your app mounts / data is ready.
  if (document.readyState === 'complete') Splash.hide();
  else window.addEventListener('load', Splash.hide);

</script>
</body>
</html>
